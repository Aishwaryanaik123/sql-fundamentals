# Local learning setup. Replace the sample secret before use.
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - superset_db:/var/lib/postgresql/data
  superset:
    image: apache/superset:latest
    depends_on: [db]
    ports: ["8088:8088"]
    environment:
      SUPERSET_SECRET_KEY: "replace-with-a-long-random-secret"
      SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://superset:superset@db:5432/superset"
    command: ["/bin/sh","-c","superset db upgrade && superset init && superset run -h 0.0.0.0 -p 8088 --with-threads"]
    restart: unless-stopped
volumes:
  superset_db:
