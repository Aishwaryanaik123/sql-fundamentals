# Local Metabase + PostgreSQL learning environment.
# Replace sample credentials before use outside a disposable local environment.
services:
  postgres:
    image: postgres:16
    container_name: metabase-postgres
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: metabase_user
      POSTGRES_PASSWORD: local_training_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/postgres_init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: metabase-app
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_app
      MB_DB_PORT: 5432
      MB_DB_USER: metabase_user
      MB_DB_PASS: local_training_password
      MB_DB_HOST: postgres
    restart: unless-stopped

volumes:
  postgres_data:
